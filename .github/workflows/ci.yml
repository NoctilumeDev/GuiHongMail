name: Public CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: guihong-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  docs:
    name: Static contracts and boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - run: python -B scripts/check.py all
  backend:
    name: Go backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - run: python -B scripts/test_mysql_commit_proxy.py
      - run: python -B scripts/test_engineering_guards.py
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath -ldflags "-X github.com/NoctilumeDev/GuiHongMail/internal/platform.BuildSource=${{ github.sha }}" ./cmd/...
  frontend:
    name: Web typecheck, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build

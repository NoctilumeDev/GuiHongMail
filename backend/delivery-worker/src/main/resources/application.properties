server.address=127.0.0.1
server.port=18082
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.tomcat.threads.max=16
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=32
server.tomcat.connection-timeout=10s
server.error.include-message=never
server.error.include-stacktrace=never
spring.application.name=guihong-delivery
spring.datasource.url=${GUIHONG_DB_URL}
spring.datasource.username=${GUIHONG_DB_USER}
spring.datasource.password=${GUIHONG_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.flyway.enabled=false
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB
logging.level.root=WARN
logging.level.dev.guihong=INFO
